name: Respaldar historico completo de DXY y PMI (una sola vez)

# Se dispara solo a mano, desde la pestana "Actions" de GitHub -> elegir este
# workflow -> boton "Run workflow". Trae TODO el historico disponible de DXY,
# PMI Manufacturero y PMI de Servicios via TradingView. El robot diario ya lo
# mantiene al dia despues de esto.
on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --no-cache-dir "git+https://github.com/rongardF/tvdatafeed.git" requests pandas

      - name: Descargar y subir historico completo de DXY y PMI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/backfill_macro_tv.py
