name: Actualizar mapa de calor RSI + MACD

# Corre cada 5 minutos (el minimo practico de GitHub Actions) para que las columnas de 5m/15m
# sirvan de verdad para trading intradia. El minuto de arranque NO es 0 a proposito: GitHub
# reconoce que "*/5" (que cae justo en :00, :05, :10...) coincide con el momento de mas carga
# de TODOS los cron de GitHub Actions a la vez, y recomienda arrancar en un minuto distinto para
# evitar ese cuello de botella - confirmado en la practica: con "*/5" el cron solo disparo SOLO
# UNA vez el solo en las primeras ~10 horas, muy lejos de cada 5 minutos.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --no-cache-dir requests

      - name: Calcular RSI + MACD del top 20 (sin stablecoins) y subir a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_rsi_heatmap.py
