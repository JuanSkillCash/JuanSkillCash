name: Actualizar mapa de calor RSI + MACD

# Corre cada 5 minutos (el minimo practico de GitHub Actions) para que las columnas de 5m/15m
# sirvan de verdad para trading intradia. GitHub no garantiza el minuto exacto bajo carga alta,
# puede atrasarse unos minutos en horas pico - las columnas mas lentas (1h/4h/1d/1w) no se ven
# afectadas por eso.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --no-cache-dir requests

      - name: Calcular RSI + MACD del top 20 (sin stablecoins) y subir a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_rsi_heatmap.py
