name: Radar de Deslistados (Bitunix, BingX, OKX, Bitget, KuCoin, Bybit, Binance, Gate)

# Cadencia horaria (igual que el "se actualiza cada hora" del dashboard de referencia que se
# investigo para esto). Los exchanges activos viven en scripts/update_exchange_delistings.py
# (FETCHERS), cada uno validado por separado contra una corrida real antes de agregarlo aqui.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: update-exchange-delistings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --no-cache-dir requests beautifulsoup4 python-dateutil playwright websocket-client
          playwright install --with-deps chromium

      - name: Actualizar Radar de Deslistados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/update_exchange_delistings.py

      # el cron propio de cada 5 min de poll-telegram-links.yml nunca disparo solo (ver ese
      # workflow) - este paso aqui es el respaldo que de verdad corre solo, aprovechando que
      # este cron horario si dispara de forma confiable
      - name: Revisar vinculos de Telegram pendientes
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/poll_telegram_links.py
