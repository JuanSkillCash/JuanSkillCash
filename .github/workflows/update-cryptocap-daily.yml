name: Actualizar CRYPTOCAP diario en Supabase

on:
  schedule:
    # 00:30 UTC todos los dias (la vela diaria de TradingView ya cerro para entonces)
    - cron: "30 0 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # tvDatafeed convierte las fechas usando la hora local de la maquina
      # que corre el script (no fuerza UTC internamente) - fijar TZ=UTC aqui
      # asegura que las velas queden siempre con la fecha/hora correcta,
      # sin depender de que el runner de GitHub siga usando UTC por defecto
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --no-cache-dir "git+https://github.com/rongardF/tvdatafeed.git" requests pandas

      - name: Descargar y subir datos del dia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_cryptocap_daily.py
