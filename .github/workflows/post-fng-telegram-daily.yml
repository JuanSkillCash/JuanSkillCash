name: Postear Miedo y Codicia diario en Telegram

# REEMPLAZADO por post-crypto-bulletin-telegram-daily.yml (una sola imagen con dominancia +
# miedo y codicia, un solo link a la pagina principal - pedido de Juan). Se deja sin "schedule"
# para que no siga posteando por su cuenta (duplicaria el boletin); workflow_dispatch se deja
# por si hace falta correrlo suelto para pruebas.
on:
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir requests pillow

      - name: Generar y postear la imagen del indice
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/post_fng_telegram.py
