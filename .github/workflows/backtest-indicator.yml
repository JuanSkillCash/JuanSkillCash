name: Backtest de indicador

# Analisis puntual (no un robot programado) - se dispara a mano desde la pestaña Actions.
# Corre scripts/backtest.py contra historia real de Binance Spot. Ver scripts/backtesting/README.md
# para la lista de indicadores disponibles y cómo agregar uno nuevo.
on:
  workflow_dispatch:
    inputs:
      indicator:
        description: "Nombre del indicador (ver scripts/backtesting/indicators/__init__.py)"
        required: false
        default: "premium_discount"
      symbol:
        description: "Par de Binance"
        required: false
        default: "BTCUSDT"
      intervals:
        description: "Temporalidades a probar, separadas por coma (ej. 3m,5m,15m,30m) - una corrida por cada una"
        required: false
        default: "15m"
      years:
        description: "Años de historia hacia atras"
        required: false
        default: "6"
      horizons:
        description: "Velas hacia adelante para medir el resultado, separadas por coma"
        required: false
        default: "10,20"
      extra_params:
        description: "Parametros propios del indicador, formato clave=valor separados por coma (ej. cooldown=5)"
        required: false
        default: ""
      modes:
        description: "Modos del indicador a probar en la misma corrida, separados por coma"
        required: false
        default: "reversion,continuacion"
      simulate:
        description: "Tambien simular operaciones reales (stop/meta/break-even), no solo acierto direccional"
        required: false
        default: "false"
      stop_pcts:
        description: "Distancias de stop-loss a probar, en %, separadas por coma"
        required: false
        default: "10,15,20"
      take_profits:
        description: "Metas de ganancia a probar, en %, separadas por coma"
        required: false
        default: "5,10,15,20,30"
      breakeven_pct:
        description: "A cuanto % de ganancia se protege moviendo el stop a la entrada ('none' para no usarlo)"
        required: false
        default: "5"
      max_bars:
        description: "Velas maximas a esperar por operacion antes de cerrar por tiempo"
        required: false
        default: "3000"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      intervals: ${{ steps.parse.outputs.intervals }}
    steps:
      - id: parse
        run: |
          IFS=',' read -ra ARR <<< "${{ github.event.inputs.intervals }}"
          JSON=$(printf '"%s",' "${ARR[@]}" | sed 's/,$//')
          echo "intervals=[$JSON]" >> "$GITHUB_OUTPUT"

  backtest:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        interval: ${{ fromJson(needs.setup.outputs.intervals) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir requests

      - name: Cache de velas ya descargadas (no repetir la descarga cada corrida)
        uses: actions/cache@v4
        with:
          path: .cache/klines
          key: klines-${{ github.event.inputs.symbol }}-${{ matrix.interval }}-${{ github.run_id }}
          restore-keys: |
            klines-${{ github.event.inputs.symbol }}-${{ matrix.interval }}-

      - name: "Correr backtest (${{ matrix.interval }})"
        run: |
          PARAMS_ARGS=""
          if [ -n "${{ github.event.inputs.extra_params }}" ]; then
            IFS=',' read -ra PAIRS <<< "${{ github.event.inputs.extra_params }}"
            for p in "${PAIRS[@]}"; do PARAMS_ARGS="$PARAMS_ARGS --param $p"; done
          fi
          SIM_ARGS=""
          if [ "${{ github.event.inputs.simulate }}" = "true" ]; then
            SIM_ARGS="--simulate --stop-pcts ${{ github.event.inputs.stop_pcts }} --take-profits ${{ github.event.inputs.take_profits }} --breakeven-pct ${{ github.event.inputs.breakeven_pct }} --max-bars ${{ github.event.inputs.max_bars }}"
          fi
          python scripts/backtest.py \
            --indicator "${{ github.event.inputs.indicator }}" \
            --symbol "${{ github.event.inputs.symbol }}" \
            --interval "${{ matrix.interval }}" \
            --years "${{ github.event.inputs.years }}" \
            --horizons "${{ github.event.inputs.horizons }}" \
            --modes "${{ github.event.inputs.modes }}" \
            --cache-dir ".cache/klines" \
            $PARAMS_ARGS $SIM_ARGS
