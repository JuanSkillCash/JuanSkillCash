name: Postear boletín cripto diario en Telegram (dominancia + miedo y codicia)

# Una sola imagen con dominancia BTC/USDT + Indice de Miedo y Codicia, un solo link a la pagina
# principal - reemplaza a post-dominance-telegram-daily.yml + post-fng-telegram-daily.yml
# (que quedan solo con workflow_dispatch, sin cron, para no duplicar el envio).
#
# OJO: el "schedule" de GitHub Actions en este repo llega atrasado 3-6 horas, sin importar el
# minuto (confirmado con el historial real de corridas) - por eso la hora real y confiable (8am
# Colombia en punto) la dispara Claude manualmente cada dia. Este "schedule" es SOLO un respaldo
# por si ese disparo manual falla o se salta un dia (paso el 28 y 29 de oct 2026 - la sesion que
# lo dispara no desperto a tiempo) - scripts/post_crypto_bulletin_telegram.py no manda el
# boletin dos veces el mismo dia (bulletin_post_state), asi que tener los dos no duplica el
# post, solo evita quedarse sin ninguno.
on:
  schedule:
    - cron: "55 12 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir requests pillow

      - name: Generar y postear el boletín
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/post_crypto_bulletin_telegram.py
