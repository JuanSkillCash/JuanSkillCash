name: Telegram (vincular cuentas)

# No hay servidor propio escuchando en vivo los mensajes del bot - este workflow revisa
# cada 5 min si llego algun "/start <codigo>" nuevo (ver scripts/poll_telegram_links.py) y
# vincula la cuenta del sitio con ese chat de Telegram.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: poll-telegram-links
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir requests

      - name: Revisar mensajes nuevos del bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/poll_telegram_links.py
