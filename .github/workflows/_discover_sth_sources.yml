name: (Descartable) Investigar forma de las APIs de STH-MVRV

# Workflow temporal, de un solo uso: solo imprime en el log la forma cruda de las respuestas de
# bitview.space y bitcoin-data.com, para poder construir el pipeline real de STH-MVRV sin
# adivinar los nombres de los campos. No escribe nada en Supabase, no usa secretos. Se borra en
# cuanto cumpla su propósito.
on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir requests

      - name: Imprimir forma de las respuestas
        run: python scripts/_discover_sth_sources.py
