name: (Temporal) Probar simbolo de TradingView para PMI de Servicios de EEUU

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir "git+https://github.com/rongardF/tvdatafeed.git"
      - run: python scripts/_probe_services_pmi.py
