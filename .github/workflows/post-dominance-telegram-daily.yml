name: Postear Dominancia BTC/USDT diario en Telegram

# 12:50 UTC = 7:50 AM hora Colombia (UTC-5) - unos minutos antes de las 8am pedidas por Juan,
# a proposito NO en punto (minuto 0): los workflows programados "en punto" compiten con miles
# de repos que agendan lo mismo a esa hora exacta, y GitHub los puede atrasar varias horas (asi
# llegaban las 7am configuradas de antes como 10:14am de verdad). Usa el valor EN VIVO de
# CoinGecko /global (no el cierre diario de TradingView), para que el dato sea el real de ese
# momento sin importar la hora exacta en que corra.
on:
  schedule:
    - cron: "50 12 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir requests pillow

      - name: Generar y postear la imagen de dominancia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/post_dominance_telegram.py
