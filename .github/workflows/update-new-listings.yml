name: Radar de Nuevos Listados (15 exchanges)

# Misma cadencia horaria que el Radar de Deslistados. Lista completa de exchanges y sus
# fuentes en scripts/update_new_listings.py.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: update-new-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --no-cache-dir requests beautifulsoup4 python-dateutil playwright websocket-client
          playwright install --with-deps chromium

      - name: Actualizar Radar de Nuevos Listados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/update_new_listings.py

      # la vinculacion de Telegram ya no depende de este robot - corre al instante via
      # webhook (supabase/functions/telegram-webhook/index.ts). Este paso solo vigila que
      # ese webhook siga registrado y sano; nunca debe tumbar esta corrida (continue-on-error)
      - name: Vigilar webhook de Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python scripts/check_telegram_webhook.py
