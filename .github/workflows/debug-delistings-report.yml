name: Radar de Deslistados - reporte de diagnostico (manual)

# Solo workflow_dispatch - esto no es parte del pipeline, es para revisar a ojo si los
# scrapers estan generando datos razonables antes de construir el frontend sobre ellos.
on:
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir requests
      - name: Reporte
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/debug_delistings_report.py
