name: Diagnostico WebSocket de Gate (manual)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir websocket-client
      - name: Diagnostico WebSocket de anuncios de Gate
        run: python scripts/debug_gate_websocket.py
