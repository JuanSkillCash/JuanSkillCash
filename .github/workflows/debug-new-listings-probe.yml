name: Radar de Nuevos Listados - sondeo de categorias (manual)

# Solo workflow_dispatch - diagnostico puntual para ubicar la categoria "New Listings" en
# cada exchange (misma fuente que ya usamos para deslistados), no toca Supabase.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --no-cache-dir requests beautifulsoup4 playwright
          playwright install --with-deps chromium
      - name: Sondeo
        run: python scripts/debug_new_listings_probe.py
