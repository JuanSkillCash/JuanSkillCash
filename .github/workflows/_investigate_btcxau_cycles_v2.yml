name: (Descartable) Investigar reglas de ciclo v2 en BTC/XAU

# Workflow temporal, de un solo uso: implementa las reglas exactas de deteccion
# de ciclos que pidio el usuario (techo=ATH con caida 65%+, min 700 dias entre
# techos quedandose con el mas alto, piso=minimo real entre techos, min 200
# dias entre cualquier techo/piso) sobre datos reales, para producir la tabla
# de validacion antes de tocar index.html. No escribe nada en Supabase, no usa
# secretos - se borra en cuanto cumpla su proposito.
on:
  workflow_dispatch: {}

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir requests

      - name: Investigar reglas de ciclo v2
        run: python scripts/_investigate_btcxau_cycles_v2.py
