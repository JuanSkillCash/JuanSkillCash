name: Diagnostico de acceso Bybit/Gate (manual)

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir requests beautifulsoup4 playwright websocket-client
      - run: playwright install --with-deps chromium
      - name: Diagnostico
        run: python scripts/debug_bybit_gate_access.py
      - name: Diagnostico estructura Bybit
        run: python scripts/debug_bybit_page_structure.py
      - name: Diagnostico announcements.bybit.com
        run: python scripts/debug_bybit_announcements_structure.py
      - name: Diagnostico fuentes de deslistados (LBank/Pionex/CoinW/Weex/Blofin)
        run: python scripts/debug_delisting_sources.py
      - name: Diagnostico fuentes de deslistados - ronda 2 (LBank/Weex/CoinW)
        run: python scripts/debug_delisting_sources2.py
      - name: Diagnostico WebSocket de anuncios de Gate (alternativa a www.gate.com)
        run: python scripts/debug_gate_websocket.py
