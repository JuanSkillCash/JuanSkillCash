name: Guardar historial de noticias

# Guarda en Supabase (news_archive) los titulares que ya trae el Worker de noticias
# (workers/rss-news/) - sin esto, una noticia desaparece para siempre en cuanto sale del RSS del
# medio (normalmente solo trae los ultimos 20-50). Ver scripts/update_news_archive.py y
# scripts/sql/create_news_archive.sql para el detalle completo.
#
# OJO: el "schedule" de GitHub Actions en este repo llega atrasado VARIAS HORAS, sin importar el
# minuto (mismo problema ya documentado en update-economic-calendar-ff.yml) - a diferencia del
# calendario economico, ESTE dato no necesita estar al minuto (es un archivo historico, no un
# valor que alguien este mirando en vivo), asi que por ahora se deja solo con el "schedule" nativo
# sin que Claude lo dispare a mano cada 30 min - si Juan nota que el historial no se esta llenando
# seguido, se puede agregar al mismo disparo manual que ya existe para el calendario.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir requests

      - name: Pedir titulares al Worker de noticias y guardar en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_news_archive.py

      # Alertas de Telegram de TODAS las noticias cripto nuevas (pedido de Juan, 20-nov-2026,
      # ampliado el 23-nov-2026 a "todas" en vez de solo las de importancia alta) - va DESPUES
      # del paso de arriba a proposito, en el mismo job: necesita que las noticias nuevas de esta
      # misma corrida ya esten guardadas en news_archive antes de revisar que mandar. Ver
      # scripts/post_important_news_telegram.py para el filtro completo (exclusion de
      # XRP/XLM/HBAR/FLR + del resumen diario "Esto es lo que sucedio en Crypto hoy...", todo
      # elegido por Juan a mano).
      - name: Mandar a Telegram las noticias cripto nuevas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/post_important_news_telegram.py
