name: (Descartable) Investigar ciclos cortos en BTC/XAU

# Workflow temporal, de un solo uso: reproduce en Python la misma logica de
# detectCyclePeaksTroughs() de BTC/XAU con datos reales, para entender por
# que aparecia un ciclo bajista de solo "7 dias". No escribe nada en
# Supabase, no usa secretos - se borra en cuanto cumpla su proposito.
on:
  workflow_dispatch: {}

jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --no-cache-dir requests

      - name: Investigar ciclos de BTC/XAU
        run: python scripts/_investigate_btcxau_cycles.py
